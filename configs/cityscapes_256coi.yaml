# Configuration for Cityscapes 256-CoI Extended YOLIC
dataset:
  name: "cityscapes_256coi"
  image_size: [224, 224]
  num_cois: 256
  top_sign_cois: 16
  road_cois: 240
  near_field_indices: [0, 40]  # CoI indices 0 to 40 trigger emergency stop in 256 setup
  num_classes: 11
  class_names:
    - "Pothole"
    - "Speed Bump"
    - "Manhole Cover"
    - "Pedestrian"
    - "Bicycle"
    - "Car"
    - "Debris"
    - "Curb"
    - "Stop Sign"
    - "Yield Sign"
    - "Warning Sign"
  background_class: "Clear Road"
  background_index: 11

model:
  backbone_type: "mobilenet_v2"
  num_cois: 256
  num_classes: 11
  cell_dim: 128
  attention_heads: 4
  attention_dropout: 0.1
  use_context_module: true
  use_grouped_head: true

training:
  epochs: 150
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_milestones: [100, 125]
  lr_gamma: 0.1
  threshold: 0.5
  save_dir: "checkpoints/cityscapes_256coi"

inference:
  temporal_alpha: 0.8
  detection_threshold: 0.5

iot:
  node_id: "urban_bot_01"
  mqtt_broker: "localhost"
  mqtt_port: 1883
  mqtt_topic: "iot/cityscapes/telemetry"
